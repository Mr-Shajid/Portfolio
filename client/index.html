<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Md. Shahriar Chy Shajid | Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Md. Shahriar Chy Shajid, a CSE graduate building web applications with a focus on software quality."
    />

    <!-- Open Graph: how the link appears when shared -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Md. Shahriar Chy Shajid | Portfolio" />
    <meta
      property="og:description"
      content="Software Quality Assurance & Full-Stack Developer. Projects, skills and contact."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Runs before the page is drawn, so the wrong theme never flashes.
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
